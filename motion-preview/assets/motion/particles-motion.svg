<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="partTitle partDesc">
  <title id="partTitle">Cybernetic Constellation Particle Field — Ravi Ranjan Singh</title>
  <desc id="partDesc">Dynamic 45-node cybernetic particle field illustrating ambient multi-agent connectivity with linear drift and proximity links.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="partBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080B" />
      <stop offset="50%" stop-color="#081014" />
      <stop offset="100%" stop-color="#05080B" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9875FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Grid -->
    <pattern id="partGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00FF88" stroke-width="0.75" stroke-opacity="0.04" />
      <circle cx="0" cy="0" r="1" fill="#00FF88" fill-opacity="0.1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="14" fill="url(#partBg)" />
  <rect width="1200" height="300" rx="14" fill="url(#partGrid)" />
  <rect x="2" y="2" width="1196" height="296" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Corner Reticles -->
  <path d="M 18 35 L 18 20 Q 18 18 20 18 L 35 18" fill="none" stroke="#00FF88" stroke-width="2" />
  <path d="M 1165 18 L 1180 18 Q 1182 18 1182 20 L 1182 35" fill="none" stroke="#00D9FF" stroke-width="2" />
  <path d="M 18 265 L 18 280 Q 18 282 20 282 L 35 282" fill="none" stroke="#00DFA5" stroke-width="2" />
  <path d="M 1165 282 L 1180 282 Q 1182 282 1182 280 L 1182 265" fill="none" stroke="#9875FF" stroke-width="2" />

