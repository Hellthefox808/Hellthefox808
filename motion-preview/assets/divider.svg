<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="Cybernetic telemetry divider">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05080B" stop-opacity="0" />
      <stop offset="15%" stop-color="#00FF88" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#00DFA5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="1" />
      <stop offset="60%" stop-color="#00DFA5" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#9875FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#05080B" stop-opacity="0" />
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <line x1="50" y1="12" x2="1150" y2="12" stroke="url(#divGrad)" stroke-width="1.5" />
  <g transform="translate(600, 12)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#00D9FF" filter="url(#divGlow)" />
    <circle cx="0" cy="0" r="2" fill="#05080B" />
    <line x1="-28" y1="0" x2="-10" y2="0" stroke="#00FF88" stroke-width="2" />
    <line x1="10" y1="0" x2="28" y2="0" stroke="#00FF88" stroke-width="2" />
    <circle cx="-32" cy="0" r="1.5" fill="#00FF88" />
    <circle cx="32" cy="0" r="1.5" fill="#00D9FF" />
  </g>
</svg>

