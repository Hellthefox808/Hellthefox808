<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Technical System Architecture — Ravi Ranjan Singh</title>
  <desc id="archDesc">Multi-layer technical architecture diagram detailing the Experience Layer, Gateway Layer, API Services, AI Orchestration, Data Layer, and Cloud Infrastructure.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080B" />
      <stop offset="50%" stop-color="#081216" />
      <stop offset="100%" stop-color="#05080B" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>

    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09201C" />
      <stop offset="100%" stop-color="#0E2D27" />
    </linearGradient>

    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#061B24" />
      <stop offset="100%" stop-color="#0A2836" />
    </linearGradient>

    <linearGradient id="layerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14112B" />
      <stop offset="100%" stop-color="#1F1A42" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="archGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#00FF88" stroke-width="0.5" stroke-opacity="0.05" />
      <circle cx="0" cy="0" r="0.75" fill="#00FF88" fill-opacity="0.12" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" rx="16" fill="url(#archBg)" />
  <rect width="1200" height="480" rx="16" fill="url(#archGrid)" />
  <rect x="2" y="2" width="1196" height="476" rx="15" fill="none" stroke="#00FF88" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Corner HUD Reticles -->
  <path d="M 20 40 L 20 20 Q 20 18 22 18 L 42 18" fill="none" stroke="#00FF88" stroke-width="2" />
  <path d="M 1158 18 L 1178 18 Q 1180 18 1180 20 L 1180 40" fill="none" stroke="#00D9FF" stroke-width="2" />
  <path d="M 20 440 L 20 460 Q 20 462 22 462 L 42 462" fill="none" stroke="#00DFA5" stroke-width="2" />
  <path d="M 1158 462 L 1178 462 Q 1180 462 1180 460 L 1180 440" fill="none" stroke="#9875FF" stroke-width="2" />

  <!-- Top Title & Telemetry Header -->
  <g transform="translate(600, 28)" text-anchor="middle">
    <text y="0" fill="#00FF88" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="2">
      // HIGH-ASSURANCE SYSTEMS TOPOLOGY //
    </text>
    <text y="22" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1">
      END-TO-END TECHNICAL ARCHITECTURE
    </text>
    <text y="38" fill="#7E92A2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5">
      Multi-tier interaction flow from user experience to autonomous agent control planes and cloud infrastructure
    </text>
    <line x1="-380" y1="46" x2="380" y2="46" stroke="url(#cyanEmerald)" stroke-width="1.5" stroke-opacity="0.6" />
  </g>

  <!-- ========================================================================= -->
  <!-- 6 HORIZONTAL ARCHITECTURAL TIERS -->
  <!-- ========================================================================= -->

  <!-- TIER 1: EXPERIENCE LAYER (L1) -->
  <g transform="translate(60, 84)">
    <rect width="1080" height="48" rx="8" fill="url(#layerGrad1)" stroke="#00FF88" stroke-width="1.2" />
    <g transform="translate(18, 29)">
      <circle cx="0" cy="0" r="4" fill="#00FF88" />
      <text x="14" y="4" fill="#00FF88" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">01 // EXPERIENCE LAYER</text>
    </g>
    <!-- Nodes -->
    <g transform="translate(230, 12)" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">
      <rect x="0" y="0" width="180" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="90" y="16" fill="#F5F7FA" text-anchor="middle">Next.js 15 App Router</text>

      <rect x="195" y="0" width="165" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="277" y="16" fill="#F5F7FA" text-anchor="middle">React 19 Server Comps</text>

      <rect x="375" y="0" width="160" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="455" y="16" fill="#F5F7FA" text-anchor="middle">Tailwind CSS / Motion</text>

      <rect x="550" y="0" width="145" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="622" y="16" fill="#F5F7FA" text-anchor="middle">SSE Stream Telemetry</text>

      <rect x="710" y="0" width="125" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="772" y="16" fill="#00FF88" text-anchor="middle">Client Cache</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -->
  <path d="M 600 132 L 600 144" stroke="#00FF88" stroke-width="1.5" stroke-dasharray="2 3" />
  <circle cx="600" cy="138" r="2" fill="#00FF88" />

  <!-- TIER 2: GATEWAY & ZERO-TRUST SECURITY LAYER (L2) -->
  <g transform="translate(60, 144)">
    <rect width="1080" height="48" rx="8" fill="url(#layerGrad2)" stroke="#00D9FF" stroke-width="1.2" />
    <g transform="translate(18, 29)">
      <circle cx="0" cy="0" r="4" fill="#00D9FF" />
      <text x="14" y="4" fill="#00D9FF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">02 // GATEWAY &amp; SECURITY</text>
    </g>
    <!-- Nodes -->
    <g transform="translate(230, 12)" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#061922" stroke="#00D9FF" stroke-width="0.8" />
      <text x="80" y="16" fill="#F5F7FA" text-anchor="middle">Nginx Load Balancer</text>

      <rect x="175" y="0" width="165" height="24" rx="4" fill="#061922" stroke="#00D9FF" stroke-width="0.8" />
      <text x="257" y="16" fill="#F5F7FA" text-anchor="middle">Bounded LRU Rate Limiter</text>

      <rect x="355" y="0" width="155" height="24" rx="4" fill="#061922" stroke="#00D9FF" stroke-width="0.8" />
      <text x="432" y="16" fill="#F5F7FA" text-anchor="middle">Scrypt Key Derivation</text>

      <rect x="525" y="0" width="170" height="24" rx="4" fill="#061922" stroke="#00D9FF" stroke-width="0.8" />
      <text x="610" y="16" fill="#F5F7FA" text-anchor="middle">UIDAI Verhoeff Checksum</text>

      <rect x="710" y="0" width="125" height="24" rx="4" fill="#061922" stroke="#00D9FF" stroke-width="0.8" />
      <text x="772" y="16" fill="#00D9FF" text-anchor="middle">Zero-Trust RBAC</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -->
  <path d="M 600 192 L 600 204" stroke="#00D9FF" stroke-width="1.5" stroke-dasharray="2 3" />
  <circle cx="600" cy="198" r="2" fill="#00D9FF" />

  <!-- TIER 3: APPLICATION & API MICROSERVICES (L3) -->
  <g transform="translate(60, 204)">
    <rect width="1080" height="48" rx="8" fill="url(#layerGrad1)" stroke="#00FF88" stroke-width="1.2" />
    <g transform="translate(18, 29)">
      <circle cx="0" cy="0" r="4" fill="#00FF88" />
      <text x="14" y="4" fill="#00FF88" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">03 // API &amp; SERVICES</text>
    </g>
    <!-- Nodes -->
    <g transform="translate(230, 12)" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="80" y="16" fill="#F5F7FA" text-anchor="middle">FastAPI Asynchronous</text>

      <rect x="175" y="0" width="165" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="257" y="16" fill="#F5F7FA" text-anchor="middle">Node.js / Express Core</text>

      <rect x="355" y="0" width="155" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="432" y="16" fill="#F5F7FA" text-anchor="middle">NestJS Domain Services</text>

      <rect x="525" y="0" width="170" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="610" y="16" fill="#F5F7FA" text-anchor="middle">Queue Draining Workers</text>

      <rect x="710" y="0" width="125" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="772" y="16" fill="#00FF88" text-anchor="middle">Zod Contracts</text>
    </g>
  </g>

  <!-- CONNECTOR 3 -->
  <path d="M 600 252 L 600 264" stroke="#00FF88" stroke-width="1.5" stroke-dasharray="2 3" />
  <circle cx="600" cy="258" r="2" fill="#00FF88" />

  <!-- TIER 4: AI ORCHESTRATION & AGENTIC FABRIC (L4) -->
  <g transform="translate(60, 264)">
    <rect width="1080" height="48" rx="8" fill="url(#layerGrad2)" stroke="#00D9FF" stroke-width="1.2" />
    <g transform="translate(18, 29)">
      <circle cx="0" cy="0" r="4" fill="#00D9FF" />
      <text x="14" y="4" fill="#00D9FF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">04 // AGENTIC CONTROL PLANE</text>
    </g>
    <!-- Nodes -->
    <g transform="translate(230, 12)" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">
      <rect x="0" y="0" width="170" height="24" rx="4" fill="#061922" stroke="#00D9FF" stroke-width="0.8" />
      <text x="85" y="16" fill="#F5F7FA" text-anchor="middle">38 Specialized Agents</text>

      <rect x="185" y="0" width="160" height="24" rx="4" fill="#061922" stroke="#00D9FF" stroke-width="0.8" />
      <text x="265" y="16" fill="#F5F7FA" text-anchor="middle">100 Domain Engines</text>

      <rect x="360" y="0" width="170" height="24" rx="4" fill="#061922" stroke="#00D9FF" stroke-width="0.8" />
      <text x="445" y="16" fill="#F5F7FA" text-anchor="middle">Model Context Protocol (MCP)</text>

      <rect x="545" y="0" width="160" height="24" rx="4" fill="#061922" stroke="#00D9FF" stroke-width="0.8" />
      <text x="625" y="16" fill="#F5F7FA" text-anchor="middle">RAG Context Engine</text>

      <rect x="720" y="0" width="115" height="24" rx="4" fill="#061922" stroke="#00D9FF" stroke-width="0.8" />
      <text x="777" y="16" fill="#00D9FF" text-anchor="middle">Audit Ledger</text>
    </g>
  </g>

  <!-- CONNECTOR 4 -->
  <path d="M 600 312 L 600 324" stroke="#00D9FF" stroke-width="1.5" stroke-dasharray="2 3" />
  <circle cx="600" cy="318" r="2" fill="#00D9FF" />

  <!-- TIER 5: DATA, VECTOR & MULTI-TIER CACHING (L5) -->
  <g transform="translate(60, 324)">
    <rect width="1080" height="48" rx="8" fill="url(#layerGrad1)" stroke="#00FF88" stroke-width="1.2" />
    <g transform="translate(18, 29)">
      <circle cx="0" cy="0" r="4" fill="#00FF88" />
      <text x="14" y="4" fill="#00FF88" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">05 // DATA &amp; STORAGE</text>
    </g>
    <!-- Nodes -->
    <g transform="translate(230, 12)" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="80" y="16" fill="#F5F7FA" text-anchor="middle">PostgreSQL / pgvector</text>

      <rect x="175" y="0" width="165" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="257" y="16" fill="#F5F7FA" text-anchor="middle">Bounded L1 LRU (5000)</text>

      <rect x="355" y="0" width="155" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="432" y="16" fill="#F5F7FA" text-anchor="middle">Redis L2 Cache Cluster</text>

      <rect x="525" y="0" width="160" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="605" y="16" fill="#F5F7FA" text-anchor="middle">Single-Flight Deduplication</text>

      <rect x="700" y="0" width="135" height="24" rx="4" fill="#061814" stroke="#00FF88" stroke-width="0.8" />
      <text x="767" y="16" fill="#00FF88" text-anchor="middle">SQLite Sync</text>
    </g>
  </g>

  <!-- CONNECTOR 5 -->
  <path d="M 600 372 L 600 384" stroke="#9875FF" stroke-width="1.5" stroke-dasharray="2 3" />
  <circle cx="600" cy="378" r="2" fill="#9875FF" />

  <!-- TIER 6: CLOUD, CONTAINER & DEVOPS INFRASTRUCTURE (L6) -->
  <g transform="translate(60, 384)">
    <rect width="1080" height="48" rx="8" fill="url(#layerGrad3)" stroke="#9875FF" stroke-width="1.2" />
    <g transform="translate(18, 29)">
      <circle cx="0" cy="0" r="4" fill="#9875FF" />
      <text x="14" y="4" fill="#C3B2FF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">06 // CLOUD INFRASTRUCTURE</text>
    </g>
    <!-- Nodes -->
    <g transform="translate(230, 12)" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#130F26" stroke="#9875FF" stroke-width="0.8" />
      <text x="70" y="16" fill="#F5F7FA" text-anchor="middle">AWS Cloud</text>

      <rect x="155" y="0" width="170" height="24" rx="4" fill="#130F26" stroke="#9875FF" stroke-width="0.8" />
      <text x="240" y="16" fill="#F5F7FA" text-anchor="middle">Docker Multi-Stage Builds</text>

      <rect x="340" y="0" width="170" height="24" rx="4" fill="#130F26" stroke="#9875FF" stroke-width="0.8" />
      <text x="425" y="16" fill="#F5F7FA" text-anchor="middle">GitHub Actions CI/CD</text>

      <rect x="525" y="0" width="155" height="24" rx="4" fill="#130F26" stroke="#9875FF" stroke-width="0.8" />
      <text x="602" y="16" fill="#F5F7FA" text-anchor="middle">Cloudflare Edge / CDN</text>

      <rect x="695" y="0" width="140" height="24" rx="4" fill="#130F26" stroke="#9875FF" stroke-width="0.8" />
      <text x="765" y="16" fill="#C3B2FF" text-anchor="middle">Observability</text>
    </g>
  </g>

  <!-- Bottom Telemetry Bar -->
  <g transform="translate(600, 462)" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="8.5" fill="#7E92A2">
    <text>
      <tspan fill="#00FF88">●</tspan> EXPERIENCE
      <tspan dx="15" fill="#00D9FF">■</tspan> ZERO-TRUST
      <tspan dx="15" fill="#00FF88">▲</tspan> MICROSERVICES
      <tspan dx="15" fill="#00D9FF">◆</tspan> AI FABRIC
      <tspan dx="15" fill="#00FF88">●</tspan> MULTI-TIER STORAGE
      <tspan dx="15" fill="#9875FF">▲</tspan> CLOUD
      <tspan dx="25" fill="#5A7184">|</tspan>
      <tspan dx="25" fill="#AAB7C4">DETERMINISTIC LATENCY &amp; BOUNDED RESOURCES</tspan>
    </text>
  </g>
</svg>
