<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Ravi Ranjan Singh — Software Engineer and AI Systems Builder (Motion)</title>
  <desc id="heroDesc">High-precision engineering blueprint showcasing candidate identity, technical competencies, and an orthogonal distributed agent control plane schematic with declarative SMIL motion.</desc>

  <defs>
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080B" />
      <stop offset="60%" stop-color="#080D11" />
      <stop offset="100%" stop-color="#05080B" />
    </linearGradient>

    <linearGradient id="hairlineEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1412" />
      <stop offset="100%" stop-color="#070E10" />
    </linearGradient>

    <pattern id="precisionGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00FF88" stroke-width="0.5" stroke-opacity="0.04" />
      <circle cx="0" cy="0" r="0.75" fill="#00FF88" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="4" fill="url(#obsidianBg)" />
  <rect width="1200" height="380" rx="4" fill="url(#precisionGrid)" />
  <rect x="0.5" y="0.5" width="1199" height="379" rx="3.5" fill="none" stroke="#00FF88" stroke-opacity="0.18" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.18;0.35;0.18" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Corner Reticles -->
  <g stroke="#00FF88" stroke-opacity="0.6" stroke-width="1.2" fill="none">
    <path d="M 12 28 L 12 12 L 28 12" />
    <path d="M 1188 28 L 1188 12 L 1172 12" />
    <path d="M 12 352 L 12 368 L 28 368" />
    <path d="M 1188 352 L 1188 368 L 1172 368" />
  </g>

  <!-- Top Metadata Header Strip -->
  <g font-family="'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace" font-size="9.5" letter-spacing="1">
    <text x="50" y="32" fill="#00FF88" font-weight="700">SPEC: DISTRIBUTED_AI // ZERO_TRUST_FABRIC</text>
    <text x="350" y="32" fill="#3D505C">|</text>
    <text x="370" y="32" fill="#8899A6">AFFIL: SARALA BIRLA UNIVERSITY (2023-2027)</text>
    <text x="730" y="32" fill="#3D505C">|</text>
    <text x="750" y="32" fill="#00D9FF">NODE_ID: RR-0808</text>
    <text x="1150" y="32" fill="#00FF88" text-anchor="end" font-weight="700">
      <tspan>ONLINE</tspan>
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </text>
  </g>
  <line x1="50" y1="42" x2="1150" y2="42" stroke="#00FF88" stroke-opacity="0.12" stroke-width="1" />

  <!-- LEFT COLUMN: EDITORIAL IDENTITY -->
  <g transform="translate(50, 72)">
    <text x="0" y="16" fill="#00FF88" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">
      SYSTEM ARCHITECTURE &amp; APPLIED AI
    </text>

    <text x="0" y="66" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="0.5">
      RAVI RANJAN SINGH
    </text>

    <text x="0" y="98" fill="#00D9FF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="17" font-weight="600" letter-spacing="2">
      SOFTWARE ENGINEER  ·  AI SYSTEMS BUILDER
    </text>

    <line x1="0" y1="116" x2="520" y2="116" stroke="url(#hairlineEmerald)" stroke-width="1" stroke-opacity="0.4" />

    <text x="0" y="146" fill="#AAB7C4" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="400">
      Engineering high-assurance agentic swarms, resilient distributed backends,
    </text>
    <text x="0" y="168" fill="#AAB7C4" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="400">
      and observable cloud platforms. Grounded in evidence, bounded by design.
    </text>

    <!-- Precise Technical Tags -->
    <g transform="translate(0, 198)" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">
      <rect x="0" y="0" width="118" height="24" rx="2" fill="url(#badgeGrad)" stroke="#00FF88" stroke-width="0.8" stroke-opacity="0.7" />
      <text x="59" y="15.5" fill="#00FF88" text-anchor="middle">AGENTIC AI</text>

      <rect x="126" y="0" width="136" height="24" rx="2" fill="url(#badgeGrad)" stroke="#00D9FF" stroke-width="0.8" stroke-opacity="0.7" />
      <text x="194" y="15.5" fill="#00D9FF" text-anchor="middle">DISTRIBUTED</text>

      <rect x="270" y="0" width="124" height="24" rx="2" fill="url(#badgeGrad)" stroke="#00DFA5" stroke-width="0.8" stroke-opacity="0.7" />
      <text x="332" y="15.5" fill="#00DFA5" text-anchor="middle">FULL-STACK</text>

      <rect x="402" y="0" width="118" height="24" rx="2" fill="url(#badgeGrad)" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.7" />
      <text x="461" y="15.5" fill="#C4B5FD" text-anchor="middle">CLOUD INFRA</text>
    </g>

    <text x="0" y="260" fill="#5A7184" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">
      PHILOSOPHY: BUILD SYSTEMS, NOT JUST INTERFACES  //  MOTTO: "IT'S ALL ABOUT TO CREATE."
    </text>
  </g>

  <!-- RIGHT COLUMN: SCHEMATIC -->
  <g transform="translate(640, 72)">
    <rect x="0" y="0" width="510" height="268" rx="3" fill="#060C0F" stroke="#00FF88" stroke-width="0.8" stroke-opacity="0.3" />
    
    <rect x="0" y="0" width="510" height="22" rx="3" fill="#081417" />
    <text x="12" y="15" fill="#00FF88" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1">
      TOPOLOGY // DISTRIBUTED AGENTIC CONTROL PLANE &amp; DATA BUS
    </text>
    <text x="498" y="15" fill="#5A7184" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="end">
      REV 2.4
    </text>

    <!-- Central Core -->
    <g transform="translate(255, 134)">
      <rect x="-85" y="-22" width="170" height="44" rx="2" fill="#081A16" stroke="#00FF88" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.7;1.0;0.7" dur="3s" repeatCount="indefinite" />
      </rect>
      <circle cx="-68" cy="0" r="3" fill="#00FF88">
        <animate attributeName="r" values="2.5;4;2.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-56" y="4" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">PRAVRAHA CORE</text>
      <text x="-56" y="15" fill="#00DFA5" font-family="'JetBrains Mono', monospace" font-size="7.5">Orchestration / RAG</text>
    </g>

    <!-- Conduits with Data Flow Packets -->
    <g stroke="#00FF88" stroke-opacity="0.35" stroke-width="1" fill="none">
      <path d="M 170 134 L 105 134 L 105 58" />
      <path d="M 340 134 L 405 134 L 405 58" />
      <path d="M 170 134 L 105 134 L 105 210" />
      <path d="M 340 134 L 405 134 L 405 210" />
    </g>

    <!-- Moving Data Packet Pulses -->
    <circle cx="105" cy="96" r="2" fill="#00D9FF">
      <animate attributeName="cy" values="58;134;58" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="405" cy="96" r="2" fill="#00FF88">
      <animate attributeName="cy" values="134;58;134" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Peripheral Nodes -->
    <g transform="translate(25, 42)">
      <rect width="160" height="32" rx="2" fill="#071318" stroke="#00D9FF" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="12" cy="16" r="2.5" fill="#00D9FF" />
      <text x="22" y="14" fill="#00D9FF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">MCP TOOL BUS</text>
      <text x="22" y="24" fill="#7E92A2" font-family="'JetBrains Mono', monospace" font-size="7">Sandboxed Protocol Host</text>
    </g>

    <g transform="translate(325, 42)">
      <rect width="160" height="32" rx="2" fill="#071814" stroke="#00FF88" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="12" cy="16" r="2.5" fill="#00FF88" />
      <text x="22" y="14" fill="#00FF88" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">38 MICRO-AGENTS</text>
      <text x="22" y="24" fill="#7E92A2" font-family="'JetBrains Mono', monospace" font-size="7">100 Autonomous Domains</text>
    </g>

    <g transform="translate(25, 194)">
      <rect width="160" height="32" rx="2" fill="#071814" stroke="#00FF88" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="12" cy="16" r="2.5" fill="#00FF88" />
      <text x="22" y="14" fill="#00FF88" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">REDIS L1/L2 CACHE</text>
      <text x="22" y="24" fill="#7E92A2" font-family="'JetBrains Mono', monospace" font-size="7">5000-Item Bounded LRU</text>
    </g>

    <g transform="translate(325, 194)">
      <rect width="160" height="32" rx="2" fill="#0F0D1C" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="12" cy="16" r="2.5" fill="#8B5CF6" />
      <text x="22" y="14" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">POSTGRES / PGVECTOR</text>
      <text x="22" y="24" fill="#7E92A2" font-family="'JetBrains Mono', monospace" font-size="7">Semantic Search Index</text>
    </g>

    <g font-family="'JetBrains Mono', monospace" font-size="7" fill="#5A7184" text-anchor="middle">
      <text x="255" y="80">ZERO-TRUST AUDIT GATE</text>
      <text x="255" y="200">SINGLE-FLIGHT DEDUP</text>
    </g>
    <line x1="255" y1="86" x2="255" y2="112" stroke="#00FF88" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="255" y1="156" x2="255" y2="190" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 2" />

    <g transform="translate(12, 254)" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#5A7184">
      <text x="0" y="0">CONCURRENCY: DETERMINISTIC</text>
      <text x="170" y="0">LATENCY: &lt;50ms</text>
      <text x="340" y="0">ASSERTIONS: 471 PASS</text>
    </g>
  </g>
</svg>
