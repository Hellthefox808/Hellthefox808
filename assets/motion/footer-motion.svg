<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="footerTitle footerDesc">
  <title id="footerTitle">Cybernetic Telemetry Footer Console (Motion) — Ravi Ranjan Singh</title>
  <desc id="footerDesc">Animated engineering footer with sweeping scanner beam, pulsing status beacon, cryptographic stamp, and verified contact coordinates.</desc>

  <defs>
    <!-- Background Gradients -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080B" />
      <stop offset="50%" stop-color="#081014" />
      <stop offset="100%" stop-color="#05080B" />
    </linearGradient>

    <!-- Linear Accent Gradients -->
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00DFA5" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFA5" />
      <stop offset="100%" stop-color="#00D9FF" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#00DFA5" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#00D9FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9875FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Scanner Divider Gradient -->
    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05080B" stop-opacity="0" />
      <stop offset="20%" stop-color="#00FF88" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="1" />
      <stop offset="80%" stop-color="#00DFA5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#05080B" stop-opacity="0" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="footerGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00FF88" stroke-width="0.75" stroke-opacity="0.05" />
      <circle cx="0" cy="0" r="1" fill="#00FF88" fill-opacity="0.15" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="220" rx="16" fill="url(#footerBg)" />
  <rect width="1200" height="220" rx="16" fill="url(#footerGrid)" />
  <rect x="2" y="2" width="1196" height="216" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Corner HUD Reticles -->
  <path d="M 18 35 L 18 20 Q 18 18 20 18 L 35 18" fill="none" stroke="#00FF88" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="26" cy="26" r="2" fill="#00FF88" />
  <path d="M 1165 18 L 1180 18 Q 1182 18 1182 20 L 1182 35" fill="none" stroke="#00D9FF" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="1174" cy="26" r="2" fill="#00D9FF" />
  <path d="M 18 185 L 18 200 Q 18 202 20 202 L 35 202" fill="none" stroke="#00DFA5" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="26" cy="194" r="2" fill="#00DFA5" />
  <path d="M 1165 202 L 1180 202 Q 1182 202 1182 200 L 1182 185" fill="none" stroke="#9875FF" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="1174" cy="194" r="2" fill="#9875FF" />

  <!-- Top Telemetry Scanner Divider -->
  <line x1="50" y1="20" x2="1150" y2="20" stroke="url(#scannerGrad)" stroke-width="1.5" />
  <!-- Sweeping Telemetry Diamond Scanner (Moves back and forth across x=100 to x=1100) -->
  <g cy="20">
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#00D9FF" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate" values="100, 20; 1100, 20; 100, 20" dur="4s" repeatCount="indefinite" />
    </polygon>
  </g>
  <g transform="translate(600, 20)">
    <circle cx="0" cy="0" r="2" fill="#00FF88" filter="url(#softGlow)">
      <animate attributeName="r" values="2; 3.5; 2" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: CANDIDATE IDENTITY & ACADEMIC CREDENTIALS -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 50)">
    <!-- Monogram Hexagon with Breathing Border -->
    <g transform="translate(24, 30)">
      <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="#061F1A" stroke="#00FF88" stroke-width="1.5" filter="url(#softGlow)">
        <animate attributeName="stroke" values="#00FF88; #00D9FF; #00FF88" dur="3s" repeatCount="indefinite" />
      </polygon>
      <text x="0" y="4.5" fill="#00FF88" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" text-anchor="middle">RR</text>
    </g>

    <!-- Details -->
    <g transform="translate(60, 15)">
      <text x="0" y="0" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800">
        RAVI RANJAN SINGH
        <tspan fill="#00FF88" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" dx="8">// NODE ID: RR-0808</tspan>
      </text>
      <text x="0" y="19" fill="#AAB7C4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5">
        Sarala Birla University • B.Tech CSE (Data Science &amp; Cloud)
      </text>
      <text x="0" y="37" fill="#7E92A2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11">
        Sergeant (SGT), 19 Jharkhand Bn NCC • Best Cadet (2019)
      </text>
      <text x="0" y="55" fill="#00DFA5" font-family="'JetBrains Mono', monospace" font-size="9.5">
        Black Belt 1st Dan Taekwondo • Cisco Certified (7x Badges)
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTER COLUMN: CORE CREED & SECURITY STAMP -->
  <!-- ========================================================================= -->
  <g transform="translate(600, 58)" text-anchor="middle">
    <text y="0" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-style="italic">
      "Think deeply. Architect deliberately. Ship with evidence."
    </text>
    <text y="24" fill="url(#neonCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="800" font-style="italic" letter-spacing="1.5">
      "IT'S ALL ABOUT TO CREATE."
    </text>
    <text y="46" fill="#00FF88" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="1">
      CRYPTOGRAPHIC INTEGRITY: SHA-256 VERIFIED • ZERO PLACEHOLDER
      <animate attributeName="opacity" values="0.7; 1.0; 0.7" dur="3s" repeatCount="indefinite" />
    </text>
    <text y="64" fill="#7E92A2" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.8">
      COORDINATES: RANCHI, IN // 23.3441° N, 85.3096° E
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT COLUMN: CONTACT & STATUS HUD -->
  <!-- ========================================================================= -->
  <g transform="translate(900, 50)">
    <!-- Status Pill with Pulsing Green Beacon -->
    <g transform="translate(0, 5)">
      <rect width="240" height="26" rx="13" fill="#061F1A" stroke="#00FF88" stroke-width="1.2" />
      <circle cx="14" cy="13" r="4.5" fill="#00FF88" filter="url(#softGlow)">
        <animate attributeName="r" values="4.5; 6; 4.5" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1; 0.4; 1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="17" fill="#00FF88" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.8">
        OPEN FOR ROLES (SWE / AI)
      </text>
    </g>

    <!-- Social / Network Handles -->
    <g transform="translate(0, 48)" font-family="'JetBrains Mono', monospace" font-size="9.5">
      <text x="0" y="0" fill="#7E92A2">LINKEDIN:</text>
      <text x="65" y="0" fill="#00D9FF" font-weight="600">ravi-ranjan-singh-0808ii</text>

      <text x="0" y="18" fill="#7E92A2">GITHUB:</text>
      <text x="65" y="18" fill="#00FF88" font-weight="600">Hellthefox808</text>

      <text x="0" y="36" fill="#7E92A2">EMAIL:</text>
      <text x="65" y="36" fill="#AAB7C4">raviranjansingh601520</text>
    </g>
  </g>

  <!-- Bottom Console Status Bar -->
  <g transform="translate(600, 195)" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.2">
    <text fill="#5A7184">
      <tspan fill="#00FF88" font-weight="700">SYS_TELEMETRY: ALL_SYSTEMS_NOMINAL</tspan>
      <tspan dx="15">//</tspan>
      <tspan fill="#AAB7C4" dx="15">HOST: GITHUB_PRODUCTION</tspan>
      <tspan dx="15">//</tspan>
      <tspan fill="#00D9FF" dx="15">BUILD: 2026.10_FINAL</tspan>
      <tspan dx="15">//</tspan>
      <tspan fill="#9875FF" dx="15">UPTIME: 99.99%</tspan>
    </text>
  </g>
</svg>
