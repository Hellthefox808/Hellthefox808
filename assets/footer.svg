<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="footerTitle footerDesc">
  <title id="footerTitle">Engineering Footer — Ravi Ranjan Singh</title>
  <desc id="footerDesc">Cybernetic horizon landscape with geometric wireframes, node coordinates, and closing engineering creed.</desc>

  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080B" />
      <stop offset="60%" stop-color="#081419" />
      <stop offset="100%" stop-color="#05080B" />
    </linearGradient>

    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#00FF88" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="1" />
      <stop offset="65%" stop-color="#00DFA5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9875FF" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cyberMesh" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.3" />
    </linearGradient>

    <pattern id="footGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00FF88" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>

    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="220" rx="16" fill="url(#footerBg)" />
  <rect width="1200" height="220" rx="16" fill="url(#footGrid)" />
  <rect x="2" y="2" width="1196" height="216" rx="15" fill="none" stroke="#00FF88" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Corner Reticles -->
  <path d="M 18 35 L 18 18 L 35 18" fill="none" stroke="#00FF88" stroke-width="2" />
  <path d="M 1165 18 L 1182 18 L 1182 35" fill="none" stroke="#00D9FF" stroke-width="2" />
  <path d="M 18 185 L 18 202 L 35 202" fill="none" stroke="#00DFA5" stroke-width="2" />
  <path d="M 1165 202 L 1182 202 L 1182 185" fill="none" stroke="#9875FF" stroke-width="2" />

  <!-- Abstract Perspective Horizon Wireframe Lines -->
  <g stroke="#00FF88" stroke-opacity="0.18" stroke-width="1" fill="none">
    <!-- Perspective Rays emanating from horizon center (600, 160) -->
    <line x1="600" y1="140" x2="0" y2="220" />
    <line x1="600" y1="140" x2="150" y2="220" />
    <line x1="600" y1="140" x2="300" y2="220" />
    <line x1="600" y1="140" x2="450" y2="220" />
    <line x1="600" y1="140" x2="750" y2="220" />
    <line x1="600" y1="140" x2="900" y2="220" />
    <line x1="600" y1="140" x2="1050" y2="220" />
    <line x1="600" y1="140" x2="1200" y2="220" />
    <!-- Horizontal Grid Lines -->
    <line x1="100" y1="155" x2="1100" y2="155" />
    <line x1="60" y1="175" x2="1140" y2="175" stroke-opacity="0.25" />
    <line x1="20" y1="200" x2="1180" y2="200" stroke-opacity="0.35" />
  </g>

  <!-- Glowing Horizon Line -->
  <line x1="40" y1="140" x2="1160" y2="140" stroke="url(#horizonGlow)" stroke-width="2.5" filter="url(#fGlow)" />

  <!-- Central Pulse Diamond -->
  <g transform="translate(600, 140)">
    <polygon points="0,-8 8,0 0,8 -8,0" fill="#00FF88" filter="url(#fGlow)" />
    <circle cx="0" cy="0" r="2.5" fill="#05080B" />
  </g>

  <!-- Core Content -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <!-- Eyebrow -->
    <text y="0" fill="#00FF88" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2">
      // END TRANSMISSION // CONTINUOUS ITERATION //
    </text>

    <!-- Main Motto -->
    <text y="32" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="1">
      "It's all about to create."
    </text>

    <!-- Subtitle creed -->
    <text y="54" fill="#00D9FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
      THINK DEEPLY • ARCHITECT DELIBERATELY • SHIP WITH EVIDENCE
    </text>

    <!-- Telemetry signature -->
    <text y="72" fill="#7E92A2" font-family="'JetBrains Mono', Menlo, monospace" font-size="10" letter-spacing="0.8">
      RAVI RANJAN SINGH // SOFTWARE ENGINEER // SARALA BIRLA UNIVERSITY (2023-2027)
    </text>
  </g>

  <!-- Bottom Coordinates Bar -->
  <g transform="translate(600, 208)" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="8.5" fill="#5A7184">
    <text>NODE: RR-0808 • LAT: 23.3441° N • LON: 85.3096° E • SYSTEM ONLINE • GITHUB @Hellthefox808</text>
  </g>
</svg>
